name: Deploy Live

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        shell: bash
        env:
          LIVE_HOST: ${{ secrets.LIVE_HOST }}
          LIVE_USER: ${{ secrets.LIVE_USER }}
          LIVE_PORT: ${{ secrets.LIVE_PORT }}
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_APP_PATH: ${{ secrets.LIVE_APP_PATH }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          missing=()
          for name in LIVE_HOST LIVE_USER LIVE_PORT LIVE_SSH_KEY LIVE_APP_PATH; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

          mkdir -p ~/.ssh
          key_file="$(mktemp)"
          printf '%s\n' "$LIVE_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          ssh -o StrictHostKeyChecking=no -i "$key_file" -p "$LIVE_PORT" "$LIVE_USER@$LIVE_HOST" \
            "APP_PATH='$LIVE_APP_PATH' DEPLOY_BRANCH='$DEPLOY_BRANCH' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd "$APP_PATH"

          if [ -d .git ]; then
            git fetch origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
          else
            echo "No Git repository found at $APP_PATH"
            exit 1
          fi

          npm ci --omit=dev

          if npm run | grep -qE '^[[:space:]]+build$'; then
            npm run build
          fi

          if ! command -v pm2 >/dev/null 2>&1; then
            echo "pm2 is not installed on the server."
            exit 1
          fi

          if pm2 describe school-crm >/dev/null 2>&1; then
            pm2 restart ecosystem.config.js --update-env
          else
            pm2 start ecosystem.config.js --update-env
          fi

          pm2 save
          echo "Deployment completed."
          REMOTE_SCRIPT

          rm -f "$key_file"
