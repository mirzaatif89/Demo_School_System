name: Deploy Live

on:
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail
          release_file="$RUNNER_TEMP/release.tgz"
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='logs' \
            --exclude='uploads' \
            --exclude='tmp' \
            --exclude='deploy-ready/package' \
            --exclude='deploy-ready/*.zip' \
            -czf "$release_file" .
          cp "$release_file" release.tgz

      - name: Deploy via SSH
        shell: bash
        env:
          LIVE_HOST: ${{ secrets.LIVE_HOST }}
          LIVE_USER: ${{ secrets.LIVE_USER }}
          LIVE_PORT: ${{ secrets.LIVE_PORT }}
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_SSH_PASSPHRASE: ${{ secrets.LIVE_SSH_PASSPHRASE }}
          LIVE_APP_PATH: ${{ secrets.LIVE_APP_PATH }}
        run: |
          set -euo pipefail

          missing=()
          for name in LIVE_HOST LIVE_USER LIVE_PORT LIVE_SSH_KEY LIVE_APP_PATH; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

          mkdir -p ~/.ssh
          key_file="$(mktemp)"
          printf '%s\n' "$LIVE_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          eval "$(ssh-agent -s)"

          if [ -n "${LIVE_SSH_PASSPHRASE:-}" ]; then
            askpass_file="$(mktemp)"
            {
              echo '#!/usr/bin/env bash'
              echo 'printf "%s\n" "$LIVE_SSH_PASSPHRASE"'
            } > "$askpass_file"
            chmod 700 "$askpass_file"
            DISPLAY=:0 SSH_ASKPASS="$askpass_file" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$key_file" </dev/null
          else
            ssh-add "$key_file"
          fi

          remote_release="/tmp/school-crm-${GITHUB_SHA}.tgz"

          scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=no -P "$LIVE_PORT" release.tgz \
            "$LIVE_USER@$LIVE_HOST:$remote_release"

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=no -p "$LIVE_PORT" "$LIVE_USER@$LIVE_HOST" \
            "APP_PATH='$LIVE_APP_PATH' RELEASE='$remote_release' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          mkdir -p "$APP_PATH"
          cd "$APP_PATH"

          preserve_dir="$(mktemp -d)"
          for item in .env admin_credentials.json permissions.json permissions-detailed.json date_sheet.json uploads logs; do
            if [ -e "$item" ]; then
              cp -a "$item" "$preserve_dir/"
            fi
          done

          find "$APP_PATH" -mindepth 1 -maxdepth 1 \
            ! -name '.env' \
            ! -name 'node_modules' \
            ! -name 'admin_credentials.json' \
            ! -name 'permissions.json' \
            ! -name 'permissions-detailed.json' \
            ! -name 'date_sheet.json' \
            ! -name 'uploads' \
            ! -name 'logs' \
            -exec rm -rf {} +

          tar -xzf "$RELEASE" -C "$APP_PATH"

          for item in .env admin_credentials.json permissions.json permissions-detailed.json date_sheet.json uploads logs; do
            if [ -e "$preserve_dir/$item" ]; then
              rm -rf "$APP_PATH/$item"
              cp -a "$preserve_dir/$item" "$APP_PATH/"
            fi
          done

          rm -rf "$preserve_dir" "$RELEASE"
          mkdir -p logs uploads

          if [ ! -f ".env" ]; then
            echo "Missing .env in $APP_PATH. Create it on the server before deploying."
            exit 1
          fi

          npm ci --omit=dev

          if npm run | grep -qE '^[[:space:]]+build$'; then
            npm run build
          fi

          if command -v pm2 >/dev/null 2>&1; then
            PM2_CMD="pm2"
          else
            npm install --no-save pm2
            PM2_CMD="npx pm2"
          fi

          if $PM2_CMD describe school-crm >/dev/null 2>&1; then
            $PM2_CMD restart ecosystem.config.js --update-env
          else
            $PM2_CMD start ecosystem.config.js --update-env
          fi

          $PM2_CMD save
          echo "Deployment completed."
          REMOTE_SCRIPT

          rm -f "$key_file"
          if [ -n "${askpass_file:-}" ]; then
            rm -f "$askpass_file"
          fi
          ssh-agent -k
