name: Deploy School CRM Live

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: school-crm-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_PORT: ${{ secrets.LIVE_PORT || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          LIVE_HOST: ${{ secrets.LIVE_HOST }}
          LIVE_USER: ${{ secrets.LIVE_USER }}
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_APP_PATH: ${{ secrets.LIVE_APP_PATH }}
        run: |
          set -euo pipefail
          missing=()
          for name in LIVE_HOST LIVE_USER LIVE_SSH_KEY LIVE_APP_PATH; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Create deployment archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='logs' \
            --exclude='uploads' \
            --exclude='tmp' \
            --exclude='deploy-ready/package' \
            --exclude='deploy-ready/*.zip' \
            -czf school-crm-release.tgz .

      - name: Configure SSH
        shell: bash
        env:
          LIVE_HOST: ${{ secrets.LIVE_HOST }}
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$LIVE_SSH_KEY" > ~/.ssh/live_deploy_key
          chmod 600 ~/.ssh/live_deploy_key
          ssh-keyscan -p "$SSH_PORT" "$LIVE_HOST" >> ~/.ssh/known_hosts

      - name: Upload release archive
        shell: bash
        env:
          LIVE_HOST: ${{ secrets.LIVE_HOST }}
          LIVE_USER: ${{ secrets.LIVE_USER }}
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i ~/.ssh/live_deploy_key school-crm-release.tgz \
            "$LIVE_USER@$LIVE_HOST:/tmp/school-crm-${GITHUB_SHA}.tgz"

      - name: Deploy on live server
        shell: bash
        env:
          LIVE_HOST: ${{ secrets.LIVE_HOST }}
          LIVE_USER: ${{ secrets.LIVE_USER }}
          LIVE_APP_PATH: ${{ secrets.LIVE_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i ~/.ssh/live_deploy_key "$LIVE_USER@$LIVE_HOST" \
            "APP_PATH='$LIVE_APP_PATH' RELEASE='/tmp/school-crm-${GITHUB_SHA}.tgz' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ -z "${APP_PATH:-}" ]; then
            echo "LIVE_APP_PATH is empty."
            exit 1
          fi

          mkdir -p "$APP_PATH"
          cd "$APP_PATH"

          if [ ! -f ".env" ]; then
            echo "Missing $APP_PATH/.env on live server."
            echo "Create it from .env.example and add production DB/SMTP credentials."
            exit 1
          fi

          PRESERVE_DIR="$(mktemp -d)"
          for item in .env admin_credentials.json permissions.json permissions-detailed.json date_sheet.json uploads logs; do
            if [ -e "$item" ]; then
              cp -a "$item" "$PRESERVE_DIR/"
            fi
          done

          find "$APP_PATH" -mindepth 1 -maxdepth 1 \
            ! -name '.env' \
            ! -name 'node_modules' \
            ! -name 'admin_credentials.json' \
            ! -name 'permissions.json' \
            ! -name 'permissions-detailed.json' \
            ! -name 'date_sheet.json' \
            ! -name 'uploads' \
            ! -name 'logs' \
            -exec rm -rf {} +

          tar -xzf "$RELEASE" -C "$APP_PATH"

          for item in .env admin_credentials.json permissions.json permissions-detailed.json date_sheet.json uploads logs; do
            if [ -e "$PRESERVE_DIR/$item" ]; then
              rm -rf "$APP_PATH/$item"
              cp -a "$PRESERVE_DIR/$item" "$APP_PATH/"
            fi
          done
          rm -rf "$PRESERVE_DIR" "$RELEASE"

          mkdir -p logs uploads

          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          else
            npm install --omit=dev
          fi

          npm run validate

          if command -v pm2 >/dev/null 2>&1; then
            pm2 start ecosystem.config.js --update-env || pm2 restart school-crm --update-env
            pm2 save
          else
            mkdir -p tmp
            touch tmp/restart.txt
          fi

          echo "Deployment completed."
REMOTE
